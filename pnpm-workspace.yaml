packages:
  - '.'

# 允许运行构建脚本的依赖列表（解决 esbuild 报错）
onlyBuiltDependencies:
  - esbuild

# 最小发布时间豁免列表
minimumReleaseAgeExclude:
  - '@vuepress-plume/*'
  - '@vuepress/*'
  - '@vue/*'
  - 'vue'
  - 'vuepress-plugin-md-power'
  - 'vuepress-theme-plume'
  - 'vuepress-plugin-filelist'
  - 'vitepress-plugin-filelist'

# 按需开启（默认先保持关闭，遇到对应问题再开）
shamefullyHoist: true
shellEmulator: true
